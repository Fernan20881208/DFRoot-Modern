name: DFRoot Modern Android TV 5.4 diagnostics

on:
  push:
    branches: [android-tv-5.4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tv-arm32:
    name: Android TV ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate read-only TV diagnostic script
        run: sh -n scripts/tv_rtd6748_probe.sh
      - name: Validate resources
        run: python3 scripts/validate_ui.py
      - name: Compile APK and run Android lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --stacktrace --no-daemon
      - name: Validate Android TV manifest and true ARM32 ABI
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT" && test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'30'"
          "$AAPT" dump badging "$APK" | grep -F "native-code: 'armeabi-v7a'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'android.intent.category.LEANBACK_LAUNCHER'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'android:banner'
          python3 scripts/verify_arm32.py "$APK"
          mkdir -p dist
          cp "$APK" dist/DFRoot-Modern-AndroidTV-ARM32-debug.apk
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DFRoot-Modern-AndroidTV-ARM32
          path: dist/*
          if-no-files-found: error
          retention-days: 30
