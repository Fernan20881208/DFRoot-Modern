name: DFRoot Modern 4.7

on:
  push:
    branches: [modern-v4.7]
  pull_request:
    branches: [modern-v4.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lkms:
    name: Kernel module (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        id: module-cache
        with:
          path: out/dfroot-${{ matrix.kmi }}.ko
          key: df-v47-${{ matrix.kmi }}-20260828-${{ hashFiles('lkm/**') }}
      - name: Build official v4.7 module
        if: steps.module-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd lkm
          make -j"$(nproc)"
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp dfroot.ko "$GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko"
      - uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko
          if-no-files-found: error
          retention-days: 7

  build-apk:
    name: Android APK
    needs: build-lkms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify engine sources exactly match upstream v4.7
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/diabl0w/DFRoot.git refs/tags/v4.7
          git diff --exit-code FETCH_HEAD HEAD -- \
            app/src/main/jni lkm app/src/main/java/df/root/ExploitRunner.java \
            app/src/main/java/df/root/BootReceiver.java
      - uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate resources
        run: python3 scripts/validate_ui.py
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug :app:lintDebug --stacktrace --no-daemon
      - name: Verify Android 12L minimum SDK (API 32) in APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT" && test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'32'"
      - name: Verify packaged native executables
        run: |
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 scripts/verify_apk.py "$APK"
          cp "$APK" dist/DFRoot-Modern-4.7-debug.apk
          git archive --format=zip --output=dist/DFRoot-Modern-4.7-source.zip HEAD
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: DFRoot-Modern-4.7
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
